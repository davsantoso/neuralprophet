name: Tes

on:
  push:
    branches: [main]
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-lock.txt
      - name: Pasang dependensi (torch CPU, versi dikunci)
        run: python -m pip install -r requirements.txt
      - name: Jalankan seluruh tes
        # Tes UI memakai key dummy dan fixture; secret BPS tidak diperlukan.
        run: python -m unittest discover -s tests -v
